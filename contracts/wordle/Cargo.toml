[package]
name = "wordle"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "21.7.7"

[dev-dependencies]
soroban-sdk = { version = "21.7.7", features = ["testutils"] }
# Pin to stay API-compatible with soroban-env-host 21.2.1 testutils (mirrors dMessage)
ed25519-dalek = "=2.2.0"

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
debug = 0
codegen-units = 1